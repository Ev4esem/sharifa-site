<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharifa — Аналитика</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .material-symbols-outlined.filled { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .period-btn { transition: all .15s; }
    .period-btn.active { background: #1a5276; color: white; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; display: inline-block; }
    tr.deal-row { cursor: pointer; }
    tr.deal-row:hover td { background: #f8fafc; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- ═══════════════════════ LOGIN SCREEN ═══════════════════════ -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-3xl shadow-xl p-10 w-full max-w-sm mx-4">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-[#1a5276] rounded-2xl flex items-center justify-center mx-auto mb-4">
        <span class="material-symbols-outlined text-white text-3xl filled">mosque</span>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Sharifa Admin</h1>
      <p class="text-gray-500 text-sm mt-1">Аналитика заявок</p>
    </div>
    <div class="space-y-4">
      <input
        type="password"
        id="passInput"
        placeholder="Введите пароль"
        class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-[#1a5276]/30 focus:border-[#1a5276] transition"
        onkeydown="if(event.key==='Enter') doLogin()"
      >
      <button
        onclick="doLogin()"
        class="w-full bg-[#1a5276] hover:bg-[#154360] text-white rounded-xl py-3 text-sm font-semibold transition"
      >
        Войти
      </button>
      <p id="loginError" class="text-red-500 text-sm text-center hidden">Неверный пароль</p>
    </div>
  </div>
</div>

<!-- ═══════════════════════ DASHBOARD ═══════════════════════ -->
<div id="dashboard" class="hidden">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-6 py-4 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-[#1a5276] rounded-lg flex items-center justify-center">
          <span class="material-symbols-outlined text-white text-base filled">mosque</span>
        </div>
        <span class="font-bold text-gray-900">Sharifa</span>
        <span class="text-gray-300 text-sm hidden sm:inline">|</span>
        <span class="text-gray-500 text-sm hidden sm:inline">Аналитика заявок</span>
      </div>
      <button onclick="doLogout()" class="flex items-center gap-1.5 text-gray-500 hover:text-gray-700 text-sm transition">
        <span class="material-symbols-outlined text-base">logout</span>
        <span class="hidden sm:inline">Выйти</span>
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-5">

    <!-- Filters bar -->
    <div class="flex flex-wrap items-center gap-3">
      <!-- Period tabs -->
      <div class="flex bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
        <button class="period-btn px-4 py-2 text-sm font-medium text-gray-600" data-period="today">Сегодня</button>
        <button class="period-btn px-4 py-2 text-sm font-medium text-gray-600 border-l border-gray-100" data-period="week">Неделя</button>
        <button class="period-btn px-4 py-2 text-sm font-medium text-gray-600 border-l border-gray-100 active" data-period="month">Месяц</button>
        <button class="period-btn px-4 py-2 text-sm font-medium text-gray-600 border-l border-gray-100" data-period="all">Всё время</button>
      </div>
      <!-- Custom range -->
      <div class="flex items-center gap-2 bg-white border border-gray-200 rounded-xl px-3 py-2 shadow-sm">
        <span class="material-symbols-outlined text-gray-400 text-base">calendar_month</span>
        <input type="date" id="dateFrom" class="text-sm outline-none w-32 text-gray-700">
        <span class="text-gray-300">—</span>
        <input type="date" id="dateTo" class="text-sm outline-none w-32 text-gray-700">
        <button onclick="loadData()" class="bg-[#1a5276] text-white text-xs px-3 py-1.5 rounded-lg font-medium transition hover:bg-[#154360]">
          Применить
        </button>
      </div>
      <!-- Branch filter -->
      <div class="relative">
        <select id="branchFilter" onchange="applyBranchFilter()" class="appearance-none bg-white border border-gray-200 rounded-xl pl-4 pr-8 py-2 text-sm text-gray-700 shadow-sm outline-none focus:ring-2 focus:ring-[#1a5276]/30 focus:border-[#1a5276] transition cursor-pointer">
          <option value="">Все филиалы</option>
          <option value="0">Гамидова</option>
          <option value="1">Акушинского</option>
          <option value="3">Петра I</option>
          <option value="5">Каспийск</option>
          <option value="11">Сурхаева</option>
        </select>
        <span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 text-base pointer-events-none">expand_more</span>
      </div>
      <!-- Refresh -->
      <button onclick="loadData()" id="refreshBtn" class="ml-auto flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-700 bg-white border border-gray-200 rounded-xl px-3 py-2 shadow-sm transition">
        <span class="material-symbols-outlined text-base" id="refreshIcon">refresh</span>
        Обновить
      </button>
    </div>

    <!-- Summary cards -->
    <div id="summaryCards" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
      <!-- Populated by JS -->
    </div>

    <!-- Leads table -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
        <h2 class="font-semibold text-gray-900">Список заявок</h2>
        <span id="totalCount" class="text-sm text-gray-400"></span>
      </div>
      <div id="leadsTableWrap">
        <div class="text-center py-16 text-gray-300">
          <span class="material-symbols-outlined text-5xl block mb-2">analytics</span>
          <p class="text-sm">Выберите период и нажмите «Обновить»</p>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- ═══════════════════════ SCRIPTS ═══════════════════════ -->
<script>
  // ── Config ─────────────────────────────────────────────────────────
  const PASSWORD   = 'sharifa2024';   // ← поменяй пароль здесь
  const API_BASE   = 'https://sharifaskc.bitrix24.ru/rest/1/ogdropg76gtlwk57/';

  // Кэш загруженных данных для быстрой фильтрации без повторных запросов
  let _allDeals    = [];
  let _allContacts = {};

  const CATEGORIES = {
    '0':  { name: 'Гамидова',    color: 'bg-blue-50 text-blue-700',   dot: 'bg-blue-400'   },
    '1':  { name: 'Акушинского', color: 'bg-green-50 text-green-700', dot: 'bg-green-400'  },
    '3':  { name: 'Петра I',     color: 'bg-purple-50 text-purple-700', dot: 'bg-purple-400' },
    '5':  { name: 'Каспийск',    color: 'bg-orange-50 text-orange-700', dot: 'bg-orange-400' },
    '11': { name: 'Сурхаева',    color: 'bg-rose-50 text-rose-700',   dot: 'bg-rose-400'   },
  };

  // ── Login / Logout ──────────────────────────────────────────────────
  function doLogin() {
    const val = document.getElementById('passInput').value;
    if (val === PASSWORD) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('loginError').classList.add('hidden');
      setPeriod('month');
    } else {
      document.getElementById('loginError').classList.remove('hidden');
      document.getElementById('passInput').value = '';
      document.getElementById('passInput').focus();
    }
  }

  function doLogout() {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('dashboard').classList.add('hidden');
    document.getElementById('passInput').value = '';
  }

  // ── Period buttons ──────────────────────────────────────────────────
  function setPeriod(period) {
    const today = new Date();
    const fmt = d => d.toISOString().split('T')[0];
    let from, to = fmt(today);

    if (period === 'today') {
      from = to;
    } else if (period === 'week') {
      const d = new Date(today);
      const day = d.getDay() || 7;
      d.setDate(d.getDate() - day + 1);
      from = fmt(d);
    } else if (period === 'month') {
      from = fmt(new Date(today.getFullYear(), today.getMonth(), 1));
    } else {
      from = '2024-01-01';
    }

    document.getElementById('dateFrom').value = from;
    document.getElementById('dateTo').value   = to;

    document.querySelectorAll('.period-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.period === period);
      if (!btn.classList.contains('active')) btn.classList.add('text-gray-600');
    });

    loadData();
  }

  document.querySelectorAll('.period-btn').forEach(btn => {
    btn.addEventListener('click', () => setPeriod(btn.dataset.period));
  });

  // Deactivate tabs on custom date change
  ['dateFrom', 'dateTo'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => {
      document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    });
  });

  // ── API helpers ─────────────────────────────────────────────────────
  // POST через FormData — тот же способ, что используют формы сайта
  async function apiPost(method, body) {
    const res = await fetch(`${API_BASE}${method}`, { method: 'POST', body });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  async function fetchAllDeals(from, to) {
    let all = [], start = 0;

    while (true) {
      const fd = new FormData();
      // Дата в формате YYYY-MM-DD HH:MM:SS — Битрикс понимает именно так
      fd.append('filter[>=DATE_CREATE]',  `${from} 00:00:00`);
      fd.append('filter[<=DATE_CREATE]',  `${to} 23:59:59`);
      // Только заявки с сайта
      fd.append('filter[SOURCE_ID]',      'WEB');
      fd.append('select[]', 'ID');
      fd.append('select[]', 'TITLE');
      fd.append('select[]', 'DATE_CREATE');
      fd.append('select[]', 'CATEGORY_ID');
      fd.append('select[]', 'CONTACT_ID');
      fd.append('start', String(start));

      const data = await apiPost('crm.deal.list', fd);
      if (!data.result || data.result.length === 0) break;
      all = all.concat(data.result);
      if (!data.next || all.length >= (data.total || 0)) break;
      start = data.next;
    }
    return all;
  }

  async function fetchContacts(ids) {
    if (!ids.length) return {};
    const contacts = {};
    for (let i = 0; i < ids.length; i += 50) {
      const chunk = ids.slice(i, i + 50);
      const fd = new FormData();
      chunk.forEach((id, j) => fd.append(`filter[ID][${j}]`, id));
      fd.append('select[]', 'ID');
      fd.append('select[]', 'NAME');
      fd.append('select[]', 'LAST_NAME');
      fd.append('select[]', 'PHONE');
      const data = await apiPost('crm.contact.list', fd);
      if (data.result) data.result.forEach(c => { contacts[c.ID] = c; });
    }
    return contacts;
  }

  // ── Main load ───────────────────────────────────────────────────────
  async function loadData() {
    const from = document.getElementById('dateFrom').value;
    const to   = document.getElementById('dateTo').value;
    if (!from || !to) return;

    // Spinner
    const icon = document.getElementById('refreshIcon');
    icon.classList.add('spin');

    // Loading state for table
    document.getElementById('leadsTableWrap').innerHTML = `
      <div class="text-center py-16 text-gray-300">
        <span class="material-symbols-outlined text-5xl block mb-2 spin">refresh</span>
        <p class="text-sm">Загрузка данных из Битрикс24…</p>
      </div>`;

    document.getElementById('summaryCards').innerHTML =
      Array(6).fill(0).map(() =>
        `<div class="bg-white rounded-2xl border border-gray-200 p-4 animate-pulse">
           <div class="h-8 bg-gray-100 rounded mb-2 w-1/2"></div>
           <div class="h-4 bg-gray-100 rounded w-3/4"></div>
         </div>`
      ).join('');

    try {
      _allDeals    = await fetchAllDeals(from, to);
      const contactIds = [...new Set(_allDeals.map(d => d.CONTACT_ID).filter(Boolean))];
      _allContacts = await fetchContacts(contactIds);

      // Сводные карточки — всегда по всем филиалам
      renderSummary(_allDeals);
      // Таблица — с учётом выбранного филиала
      applyBranchFilter();
    } catch (err) {
      document.getElementById('summaryCards').innerHTML = '';
      document.getElementById('leadsTableWrap').innerHTML = `
        <div class="text-center py-16 text-red-300">
          <span class="material-symbols-outlined text-5xl block mb-2">error_outline</span>
          <p class="text-sm">Ошибка загрузки. Проверьте подключение к интернету.</p>
          <p class="text-xs text-gray-400 mt-1">${err.message}</p>
        </div>`;
    }

    icon.classList.remove('spin');
  }

  // ── Клик по карточке = выбор филиала ───────────────────────────────
  function selectBranch(catId) {
    document.getElementById('branchFilter').value = catId;
    applyBranchFilter();
  }

  // ── Branch filter (клиентская, без повторных запросов) ─────────────
  function applyBranchFilter() {
    const branchId = document.getElementById('branchFilter').value;
    const filtered = branchId
      ? _allDeals.filter(d => String(d.CATEGORY_ID ?? '0') === branchId)
      : _allDeals;

    // Подсветить активную карточку
    document.querySelectorAll('.summary-card').forEach(card => {
      const isActive = !branchId || card.dataset.catId === branchId;
      card.classList.toggle('opacity-40', !isActive);
      card.classList.toggle('ring-2',      isActive && !!branchId);
      card.classList.toggle('ring-[#1a5276]', isActive && !!branchId);
    });

    renderTable(filtered, _allContacts);
  }

  // ── Render summary cards ────────────────────────────────────────────
  function renderSummary(deals) {
    const counts = {};
    Object.keys(CATEGORIES).forEach(k => { counts[k] = 0; });
    deals.forEach(d => {
      const k = String(d.CATEGORY_ID ?? '0');
      counts[k] = (counts[k] || 0) + 1;
    });

    let html = `
      <div class="summary-card bg-[#1a5276] text-white rounded-2xl p-4 flex flex-col justify-between min-h-[90px] transition-all cursor-pointer" data-cat-id="" onclick="selectBranch('')">
        <span class="text-3xl font-bold">${deals.length}</span>
        <span class="text-sm opacity-75 mt-1">Все филиалы</span>
      </div>`;

    Object.entries(CATEGORIES).forEach(([id, cat]) => {
      html += `
        <div class="summary-card bg-white rounded-2xl border border-gray-200 p-4 flex flex-col justify-between min-h-[90px] transition-all cursor-pointer hover:border-[#1a5276]/40" data-cat-id="${id}" onclick="selectBranch('${id}')">
          <span class="text-3xl font-bold text-gray-900">${counts[id] || 0}</span>
          <div class="flex items-center gap-1.5 mt-1">
            <span class="w-2 h-2 rounded-full ${cat.dot}"></span>
            <span class="text-sm text-gray-500">${cat.name}</span>
          </div>
        </div>`;
    });

    document.getElementById('summaryCards').innerHTML = html;
  }

  // ── Render leads table ──────────────────────────────────────────────
  function renderTable(deals, contacts) {
    document.getElementById('totalCount').textContent = `${deals.length} заявок`;

    if (deals.length === 0) {
      document.getElementById('leadsTableWrap').innerHTML = `
        <div class="text-center py-16 text-gray-300">
          <span class="material-symbols-outlined text-5xl block mb-2">inbox</span>
          <p class="text-sm">Заявок за выбранный период нет</p>
        </div>`;
      return;
    }

    // Sort newest first
    deals.sort((a, b) => new Date(b.DATE_CREATE) - new Date(a.DATE_CREATE));

    const rows = deals.map(deal => {
      const contact = contacts[deal.CONTACT_ID] || {};
      const name    = [contact.NAME, contact.LAST_NAME].filter(Boolean).join(' ')
                      || deal.TITLE || '—';
      const rawPhone = contact.PHONE && contact.PHONE[0] ? contact.PHONE[0].VALUE : null;
      const phone    = rawPhone || '—';
      const catId    = String(deal.CATEGORY_ID ?? '0');
      const cat      = CATEGORIES[catId] || { name: `Воронка ${catId}`, color: 'bg-gray-100 text-gray-600', dot: 'bg-gray-400' };

      const d    = new Date(deal.DATE_CREATE);
      const date = d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const time = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

      const phoneLink = rawPhone
        ? `<a href="tel:${rawPhone}" class="text-[#1a5276] hover:underline">${phone}</a>`
        : `<span class="text-gray-400">—</span>`;

      const bitrixUrl = `https://sharifaskc.bitrix24.ru/crm/deal/details/${deal.ID}/`;

      return `
        <tr class="deal-row border-b border-gray-50 last:border-0 hover:bg-blue-50/40 cursor-pointer transition-colors" onclick="window.open('${bitrixUrl}', '_blank')">
          <td class="px-6 py-3.5 text-sm text-gray-500 whitespace-nowrap">
            ${date}
            <span class="text-gray-300 ml-1">${time}</span>
          </td>
          <td class="px-6 py-3.5 text-sm font-medium text-gray-900">${escHtml(name)}</td>
          <td class="px-6 py-3.5 text-sm" onclick="event.stopPropagation()">${phoneLink}</td>
          <td class="px-6 py-3.5 text-sm">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium ${cat.color}">
              <span class="w-1.5 h-1.5 rounded-full ${cat.dot}"></span>
              ${cat.name}
            </span>
          </td>
          <td class="px-4 py-3.5 text-right">
            <span class="inline-flex items-center gap-1 text-xs text-gray-400 hover:text-[#1a5276] transition-colors">
              <span class="material-symbols-outlined text-base">open_in_new</span>
              Открыть
            </span>
          </td>
        </tr>`;
    }).join('');

    document.getElementById('leadsTableWrap').innerHTML = `
      <div class="overflow-x-auto">
        <table class="w-full min-w-[560px]">
          <thead>
            <tr class="bg-gray-50 border-b border-gray-100">
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-400 uppercase tracking-wide">Дата</th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-400 uppercase tracking-wide">Имя</th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-400 uppercase tracking-wide">Телефон</th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-400 uppercase tracking-wide">Филиал</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
