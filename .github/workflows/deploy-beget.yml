name: Deploy to Beget

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beget-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare website files
        shell: bash
        run: |
          mkdir -p deploy
          while IFS= read -r -d '' file; do
            case "$file" in
              CLAUDE.md|.DS_Store|*/.DS_Store) continue ;;
            esac
            mkdir -p "deploy/$(dirname "$file")"
            cp -- "$file" "deploy/$file"
          done < <(git ls-files -z)

      - name: Check deployment secret
        id: credentials
        env:
          BEGET_SSH_PASSWORD: ${{ secrets.BEGET_SSH_PASSWORD }}
        run: |
          if [[ -z "$BEGET_SSH_PASSWORD" ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped: add the BEGET_SSH_PASSWORD repository secret." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload website over SSH
        if: steps.credentials.outputs.present == 'true'
        uses: appleboy/scp-action@v1
        with:
          host: marzhane.beget.tech
          username: marzhane
          password: ${{ secrets.BEGET_SSH_PASSWORD }}
          port: 22
          source: deploy/**
          target: sharifa.ru/public_html
          strip_components: 1
